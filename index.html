<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mechanical Engineering with CAD</title>
    <meta
      name="description"
      content="A progressive, checkpoint-based path from zero CAD experience to intermediate parametric modeling."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Desktop only. This asset is 2.2MB and is not used on phones, where the
      hero falls back to a 38KB static plate; fetching it there just saturates
      a slow connection. It must be `preload`, not `prefetch`: Chromium ignores
      the media attribute on prefetch and pulls the file down anyway.
    -->
    <link
      rel="preload"
      as="image"
      href="/assets/skyscraper-construction.svg"
      type="image/svg+xml"
      media="(min-width: 769px)"
    />
    <!-- The phone's establishing shot: a baked frame, so it needs no SMIL. -->
    <link
      rel="preload"
      as="image"
      href="/assets/house-construction-final.png"
      type="image/png"
      media="(max-width: 768px)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
