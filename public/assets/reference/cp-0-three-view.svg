<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none"
     stroke="#ffffff" stroke-width="1.6" font-family="monospace" font-size="11">
  <!-- Reference for Checkpoint 0: three orthographic views of a stepped block,
       laid out in third angle, with the projection lines that prove they agree. -->
  <g stroke-dasharray="4 4" stroke-width="0.8" opacity="0.55">
    <line x1="60" y1="120" x2="470" y2="120"/>
    <line x1="60" y1="190" x2="470" y2="190"/>
    <line x1="150" y1="40"  x2="150" y2="340"/>
    <line x1="250" y1="40"  x2="250" y2="340"/>
  </g>

  <text x="60" y="34" fill="#ffffff" stroke="none" opacity="0.8">TOP</text>
  <g transform="translate(60,45)">
    <rect x="0" y="0" width="190" height="60"/>
    <line x1="120" y1="0" x2="120" y2="60"/>
  </g>

  <text x="60" y="146" fill="#ffffff" stroke="none" opacity="0.8">FRONT</text>
  <g transform="translate(60,155)">
    <path d="M0 70 L0 0 L120 0 L120 34 L190 34 L190 70 Z"/>
  </g>

  <text x="300" y="146" fill="#ffffff" stroke="none" opacity="0.8">SIDE</text>
  <g transform="translate(300,155)">
    <rect x="0" y="0" width="60" height="70"/>
    <line x1="0" y1="34" x2="60" y2="34" stroke-dasharray="6 4" stroke-width="1"/>
  </g>

  <!-- One dimension, with units, because a sketch without units is not a drawing. -->
  <g stroke-width="1" opacity="0.9">
    <line x1="60" y1="270" x2="250" y2="270"/>
    <path d="M60 266 L60 274 M250 266 L250 274"/>
    <text x="142" y="264" fill="#ffffff" stroke="none">95 mm</text>
  </g>

  <text x="60" y="330" fill="#ffffff" stroke="none" opacity="0.7" font-size="10">
    THREE VIEWS, ALIGNED, DIMENSIONED IN mm
  </text>
</svg>
